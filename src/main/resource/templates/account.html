<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Min konto</title>

    <link rel="stylesheet" href="/account.css">
    <link rel="stylesheet" href="/colors.css">
</head>

<body>

<div class="account-page">

    <div class="account-header">
        <a href="/menu" class="back-button">←</a>
        <h1>Min konto</h1>
    </div>

    <div class="account-content">

        <h2>Kontooplysninger</h2>

        <!-- Email -->
        <div class="account-field">
            <label>Email</label>

            <div class="field-row">
                <span th:text="${user.mail}"></span>

                <button type="button"
                        onclick="editField('email')">
                    Ændr
                </button>
            </div>

            <form id="email-form"
                  action="/account/update"
                  method="post"
                  style="display: none;">

                <input type="hidden" name="field" value="email">

                <input type="email"
                       name="value"
                       th:value="${user.mail}"
                       placeholder="Ny email"
                       required>

                <button type="submit">Gem</button>
                <button type="button"
                        onclick="cancelEdit('email')">
                    Annuller
                </button>
            </form>
        </div>

        <!-- Mobilnummer -->
        <div class="account-field">
            <label>Mobilnummer</label>

            <div class="field-row">
                <span th:text="${user.phoneNumber}"></span>

                <button type="button"
                        onclick="editField('phone')">
                    Ændr
                </button>
            </div>

            <form id="phone-form"
                  action="/account/update"
                  method="post"
                  style="display: none;">

                <input type="hidden" name="field" value="phone">

                <input type="tel"
                       name="value"
                       th:value="${user.phoneNumber}"
                       placeholder="Nyt mobilnummer"
                       required>

                <button type="submit">Gem</button>
                <button type="button"
                        onclick="cancelEdit('phone')">
                    Annuller
                </button>
            </form>
        </div>

        <!-- Adgangskode -->
        <div class="account-field">
            <label>Adgangskode</label>

            <div class="field-row">
                <span>••••••••</span>

                <button type="button"
                        onclick="editField('password')">
                    Ændr
                </button>
            </div>

            <form id="password-form"
                  action="/account/password"
                  method="post"
                  style="display: none;">

                <input type="password"
                       name="newPassword"
                       placeholder="Ny adgangskode"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <input type="password"
                       name="confirmPassword"
                       placeholder="Gentag ny adgangskode"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <button type="submit">Gem</button>
                <button type="button"
                        onclick="cancelEdit('password')">
                    Annuller
                </button>
            </form>
        </div>

    </div>
</div>

<script>
    function editField(field) {
        document.getElementById(field + '-form').style.display = 'block';
    }

    function cancelEdit(field) {
        const form = document.getElementById(field + '-form');
        form.reset();
        form.style.display = 'none';
    }
</script>

</body>
</html>
