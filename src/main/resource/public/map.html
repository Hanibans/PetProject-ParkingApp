<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="map.css">
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <title>Map</title>
</head>

<body>

<div class="map-page">

    <div id="no-vehicle-popup" class="popup-overlay">

        <div class="popup-box">

            <div class="popup-icon">🚗</div>

            <h2>Ingen nummerplade</h2>

            <p>
                Du skal registrere en nummerplade,
                før du kan starte en parkering.
            </p>

            <div class="popup-buttons">

                <button
                        id="register-vehicle-button"
                        type="button">
                    Registrer nummerplade
                </button>

                <button
                        id="close-popup-button"
                        type="button">
                    Annuller
                </button>

            </div>

        </div>

    </div>

    <div id="map"></div>

    <div id="zone-info">
        <p>Vælg en parkeringszone på kortet.</p>
    </div>

    <div class="search-bar">

        <span class="search-icon">&#128269;</span>

        <input
                type="text"
                id="searchInput"
                placeholder="Søg på lokation..."
                autocomplete="off"
        >

        <div id="searchSuggestions"></div>

    </div>

    <a href="menu.html" class="menu-icon-button">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </a>

</div>


<!-- Leaflet JavaScript -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

    // ==========================================
    // KORT
    // ==========================================

    const map = L.map('map').setView(
        [55.6861, 12.5683],
        13
    );

    let parkingLayer = L.layerGroup().addTo(map);


    // OpenStreetMap
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    // ==========================================
    // SØGNING
    // ==========================================

    const searchInput =
        document.getElementById("searchInput");

    console.log(
        "Søgefelt fundet:",
        searchInput
    );

    const searchSuggestions =
        document.getElementById(
            "searchSuggestions"
        );

    let searchMarker = null;

    let searchTimeout = null;


    searchInput.addEventListener(
        "input",
        function() {

            const searchText =
                searchInput.value.trim();

            if (searchText.length < 2) {

                searchSuggestions.innerHTML = "";

                searchSuggestions.style.display =
                    "none";

                return;
            }

            clearTimeout(searchTimeout);

            searchTimeout = setTimeout(
                function() {
                    searchLocations(searchText);
                },
                300
            );
        }
    );


    function searchLocations(searchText) {

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&q=" +
            encodeURIComponent(searchText) +
            "&limit=5" +
            "&countrycodes=dk" +
            "&addressdetails=1";


        fetch(url)

            .then(response => response.json())

            .then(data => {

                searchSuggestions.innerHTML = "";


                if (data.length === 0) {

                    searchSuggestions.style.display =
                        "none";

                    return;
                }


                data.forEach(function(place) {

                    const suggestion =
                        document.createElement("div");


                    suggestion.classList.add(
                        "search-suggestion"
                    );


                    const address =
                        place.address;


                    let locationName =
                        place.name ||
                        place.display_name.split(",")[0];


                    let locationAddress = "";


                    if (address) {

                        if (address.road) {
                            locationAddress +=
                                address.road;
                        }

                        if (address.house_number) {
                            locationAddress +=
                                " " +
                                address.house_number;
                        }

                        if (address.city) {
                            locationAddress +=
                                ", " +
                                address.city;
                        }
                    }


                    suggestion.innerHTML = `

                        <div class="suggestion-name">
                            📍 ${locationName}
                        </div>

                        <div class="suggestion-address">
                            ${locationAddress}
                        </div>

                    `;


                    suggestion.addEventListener(
                        "click",
                        function() {

                            selectLocation(place);

                        }
                    );


                    searchSuggestions.appendChild(
                        suggestion
                    );

                });


                searchSuggestions.style.display =
                    "block";

            })


            .catch(error => {

                console.error(
                    "Fejl ved søgning:",
                    error
                );

            });

    }


    function selectLocation(place) {

        const latitude =
            parseFloat(place.lat);

        const longitude =
            parseFloat(place.lon);


        map.setView(
            [
                latitude,
                longitude
            ],
            16
        );


        if (searchMarker !== null) {

            map.removeLayer(
                searchMarker
            );

        }


        searchMarker =
            L.marker([
                latitude,
                longitude
            ])

                .addTo(map)

                .bindPopup(
                    place.display_name
                )

                .openPopup();


        const address =
            place.address;


        let searchResult =
            place.name || "";


        if (address) {

            if (address.postcode) {

                searchResult +=
                    ", " +
                    address.postcode;

            }

            if (address.city) {

                searchResult +=
                    " " +
                    address.city;

            }

            if (address.municipality) {

                searchResult +=
                    ", " +
                    address.municipality;

            }

        }


        searchInput.value =
            searchResult;


        searchSuggestions.innerHTML = "";

        searchSuggestions.style.display =
            "none";

    }


    // ==========================================
    // PARKERINGSAREALER
    // ==========================================


    let parkingAreas = [];

    let parkingZoneFeatures = [];

    function pointInRing(lon, lat, ring) {
        let inside = false;

        for (let i = 0, j = ring.length - 1;
             i < ring.length;
             j = i++) {

            const xi = ring[i][0];
            const yi = ring[i][1];
            const xj = ring[j][0];
            const yj = ring[j][1];

            const intersects =
                ((yi > lat) !== (yj > lat)) &&
                (lon < (xj - xi) * (lat - yi) /
                    (yj - yi) + xi);

            if (intersects) {
                inside = !inside;
            }
        }

        return inside;
    }

    function pointInPolygon(lon, lat, polygon) {
        if (!polygon.length ||
            !pointInRing(lon, lat, polygon[0])) {
            return false;
        }

        // Undgå at regne områder inden i huller
        // i polygonen som en del af zonen.
        for (let i = 1; i < polygon.length; i++) {
            if (pointInRing(lon, lat, polygon[i])) {
                return false;
            }
        }

        return true;
    }

    function findParkingZone(latlng) {
        const lon = latlng.lng;
        const lat = latlng.lat;

        return parkingZoneFeatures.find(function(feature) {
            const geometry = feature.geometry;

            if (!geometry) {
                return false;
            }

            if (geometry.type === "Polygon") {
                return pointInPolygon(
                    lon, lat, geometry.coordinates
                );
            }

            if (geometry.type === "MultiPolygon") {
                return geometry.coordinates.some(
                    function(polygon) {
                        return pointInPolygon(
                            lon, lat, polygon
                        );
                    }
                );
            }

            return false;
        }) || null;
    }
    let parkingRequestId = 0;

    async function loadParkingAreas() {
        const bounds = map.getBounds();

        const params = new URLSearchParams({
            west: bounds.getWest(),
            south: bounds.getSouth(),
            east: bounds.getEast(),
            north: bounds.getNorth()
        });

        const requestId = ++parkingRequestId;

        try {
            const response = await fetch(
                "/parking-areas?" + params.toString()
            );

            if (!response.ok) {
                throw new Error("Kunne ikke hente parkeringsdata");
            }

            const data = await response.json();

            // Ignorer gamle svar, hvis kortet allerede er flyttet igen
            if (requestId !== parkingRequestId) {
                return;
            }

            parkingAreas = data.features || [];

            console.log(
                "Parkeringspladser i synligt område:",
                parkingAreas.length
            );

            showParkingAreas("");

        } catch (error) {
            console.error(
                "Kunne ikke hente parkeringspladser:",
                error
            );
        }
    }

    // Hent data, når kortet flyttes eller zoomes
    map.on("moveend", loadParkingAreas);

    // Hent data første gang
    loadParkingAreas();



    // ==========================================
    // VIS PARKERINGSAREALER
    // ==========================================


    function showParkingAreas(zoneName) {

        if (map.getZoom() < 18) {
            parkingLayer.clearLayers();
            return;
        }

        // Fjern tidligere parkeringsikoner
        if (parkingLayer !== null) {
            map.removeLayer(parkingLayer);
        }

        parkingLayer = L.layerGroup().addTo(map);

        const matchingAreas = parkingAreas;

        console.log(
            "Parkeringsarealer i " + zoneName + " zone:",
            matchingAreas
        );

        // Saml parkeringsikoner i ét lag
        parkingLayer = L.layerGroup().addTo(map);

        // Gem alle markører, så vi kan styre dem efter zoomniveau
        const parkingMarkers = [];

        function updateParkingMarkers() {
            const zoom = map.getZoom();

            parkingMarkers.forEach(function(marker) {
                const markerZoom = marker.options.showFromZoom;

                if (zoom >= markerZoom) {
                    if (!parkingLayer.hasLayer(marker)) {
                        parkingLayer.addLayer(marker);
                    }
                } else {
                    parkingLayer.removeLayer(marker);
                }
            });
        }


        // Lav et ikon for hvert parkeringsareal
        matchingAreas.forEach(function(feature) {

            const properties = feature.properties;

            const street = properties.vejnavn || "Ukendt vej";
            const numberOfSpaces = properties.antal_pladser || 0;
            const parkingType = properties.p_type || "Parkering";

            // Find centrum af parkeringsarealet
            const areaLayer = L.geoJSON(feature);
            const bounds = areaLayer.getBounds();

            if (!bounds.isValid()) {
                return;
            }

            const center = bounds.getCenter();


            const zoneFeature = findParkingZone(center);

            const zoneName = zoneFeature
                ? zoneFeature.properties.zone_navn
                : null;

            const zonePrice = zoneFeature
                ? zoneFeature.properties.ptakst_dag
                : null;

            const zoneDetails = zoneName && zonePrice != null
                ? `<b>Zone:</b> ${zoneName} betalingszone<br>
       <b>Pris:</b> ${zonePrice} kr./time`
                : `<b>Zone og pris:</b> Kunne ikke bestemmes for denne parkeringsplads.`;

            const parkingDetails = `
    <b>${street}</b><br>
    <b>Antal parkeringspladser:</b> ${numberOfSpaces}<br>
    <b>Parkeringsordning:</b> ${parkingType}<br>
    ${zoneDetails}
`;

            const parkingOrder = (properties.p_ordning || "").toLowerCase();

            let iconSymbol = "🚗";
            let categoryName = "Almindelig parkering";
            let iconColor = "#3976D2";

            if (parkingOrder.includes("elbil")) {
                iconSymbol = "⚡";
                categoryName = "Elbilparkering";
                iconColor = "#269B69";
            } else if (parkingOrder.includes("handicap")) {
                iconSymbol = "♿";
                categoryName = "Handicapparkering";
                iconColor = "#8B5CC7";
            } else if (parkingOrder.includes("delebil")) {
                iconSymbol = "🔑";
                categoryName = "Delebilparkering";
                iconColor = "#E5A12B";
            } else if (parkingOrder.includes("privat")) {
                iconSymbol = "🔒";
                categoryName = "Privat parkering";
                iconColor = "#64748B";
            } else if (parkingOrder.includes("motorcykel")) {
                iconSymbol = "🏍️";
                categoryName = "Motorcykelparkering";
                iconColor = "#D85A42";
            }


            const parkingIcon = L.divIcon({
                className: "parking-pin-icon",
                html: `
        <div style="
            position: relative;
            width: 40px;
            height: 48px;
            display: flex;
            justify-content: center;
        ">
            <!-- Kortnålens spids -->
            <div style="
                position: absolute;
                bottom: 2px;
                width: 20px;
                height: 20px;
                background: ${iconColor};
                transform: rotate(45deg);
                border-radius: 0 0 4px 0;
            "></div>

            <!-- Kortnålens runde top -->
            <div style="
                position: absolute;
                top: 0;
                width: 38px;
                height: 38px;
                background: ${iconColor};
                border: 2px solid white;
                border-radius: 50%;
                box-shadow: 0 2px 6px rgba(0,0,0,0.35);
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                z-index: 1;
            ">
                <div style="
                    width: 27px;
                    height: 27px;
                    background: white;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 17px;
                    line-height: 1;
                ">${iconSymbol}</div>
            </div>
        </div>
    `,
                iconSize: [40, 48],
                iconAnchor: [20, 48],
                popupAnchor: [0, -46]
            });



            const marker = L.marker(center, {
                icon: parkingIcon,
                showFromZoom: 18
            });

            parkingMarkers.push(marker);


            const initialPopup = `
    ${parkingDetails}
    <br><br>

    <label for="vehicle-select">Vælg nummerplade:</label>
    <br>

    <select id="vehicle-select" class="vehicle-select">
        <option value="">Indlæser biler...</option>
    </select>

    <br><br>

    <button class="start-parking-button" type="button" disabled>
        Start parkering
    </button>
`;


            marker.bindPopup(initialPopup);

            // Håndter knapperne, når popup-vinduet åbnes

            marker.on("popupopen", async function(event) {
                const popupElement = event.popup.getElement();

                if (!popupElement) {
                    return;
                }

                const button = popupElement.querySelector(
                    ".start-parking-button"
                );

                const vehicleSelect = popupElement.querySelector(
                    "#vehicle-select"
                );

                if (!button || !vehicleSelect) {
                    return;
                }

                // Start-knappen er deaktiveret, indtil bilerne er hentet
                button.disabled = true;
                vehicleSelect.disabled = true;
                vehicleSelect.innerHTML =
                    '<option value="">Indlæser biler...</option>';

                try {
                    const response = await fetch("/my-vehicles");

                    if (!response.ok) {
                        throw new Error(
                            "Kunne ikke hente biler. HTTP-status: " +
                            response.status
                        );
                    }

                    const cars = await response.json();

                    if (cars.length === 0) {
                        vehicleSelect.innerHTML =
                            '<option value="">Ingen biler registreret</option>';

                        const noVehiclePopup =
                            document.getElementById("no-vehicle-popup");

                        if (noVehiclePopup) {
                            noVehiclePopup.style.display = "flex";
                        }

                        return;
                    }

                    vehicleSelect.innerHTML =
                        '<option value="">Vælg nummerplade</option>' +
                        cars.map(function(car) {
                            return `
                    <option value="${car.licensePlate}">
                        ${car.licensePlate} - ${car.type}
                    </option>
                `;
                        }).join("");

                    vehicleSelect.disabled = false;

                    // Brugeren skal vælge en nummerplade manuelt
                    vehicleSelect.onchange = function() {
                        button.disabled = vehicleSelect.value === "";
                    };

                    button.disabled = true;

                    button.onclick = function(clickEvent) {
                        clickEvent.stopPropagation();

                        const licensePlate = vehicleSelect.value;

                        if (!licensePlate) {
                            alert("Vælg en nummerplade først.");
                            return;
                        }

                        button.disabled = true;

                        startParking(
                            zoneName,
                            parkingOrder,
                            feature.id,
                            licensePlate
                        );
                    };

                } catch (error) {
                    console.error("Fejl ved hentning af biler:", error);

                    vehicleSelect.innerHTML =
                        '<option value="">Kunne ikke hente biler</option>';

                    vehicleSelect.disabled = true;
                    button.disabled = true;

                    alert("Kunne ikke hente dine biler. Prøv igen.");
                }
            });
        });

        updateParkingMarkers();

        map.off("zoomend", updateParkingMarkers);
        map.on("zoomend", updateParkingMarkers);
    }



    function startParking(
        zone,
        parkingOrder,
        parkingAreaId,
        licensePlate
    ) {
        console.log("Starter parkering...");
        console.log("Betalingszone:", zone);
        console.log("Parkeringsordning:", parkingOrder);
        console.log("Parkeringsareal:", parkingAreaId);
        console.log("Nummerplade:", licensePlate);

        fetch("/parking/start", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "zone=" + encodeURIComponent(zone) +
                "&parkingOrder=" + encodeURIComponent(parkingOrder) +
                "&parkingAreaId=" + encodeURIComponent(parkingAreaId) +
                "&licensePlate=" + encodeURIComponent(licensePlate)
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(message => {
                        throw new Error(message);
                    });
                }

                return response.text();
            })
            .then(data => {
                window.location.href = "/active-parking";
            })
            .catch(error => {
                if (error.message === "Ingen nummerplade registreret") {
                    const goToVehicles = confirm(
                        "🚗 Ingen nummerplade registreret.\n\n" +
                        "Du skal registrere en nummerplade, " +
                        "før du kan starte en parkering.\n\n" +
                        "Vil du registrere en nu?"
                    );

                    if (goToVehicles) {
                        window.location.href = "/vehicles";
                    }

                    return;
                }

                console.error("Fejl:", error);
                alert("Der skete en fejl: " + error.message);
            });
    }


    const registerVehicleButton =
        document.getElementById(
            "register-vehicle-button"
        );

    const closePopupButton =
        document.getElementById(
            "close-popup-button"
        );

    registerVehicleButton.addEventListener(
        "click",
        function() {

            window.location.href =
                "/vehicles";
        }
    );

    closePopupButton.addEventListener(
        "click",
        function() {

            document.getElementById(
                "no-vehicle-popup"
            ).style.display = "none";
        }
    );


    // ==========================================
    // PARKERINGSZONER
    // ==========================================

    fetch("/parking-zones")

        .then(response => response.json())

        .then(data => {

            parkingZoneFeatures = data.features || [];

            console.log(
                "Parkeringszoner:",
                data
            );


            L.geoJSON(
                data,
                {

                    // --------------------------
                    // ZONE FARVER
                    // --------------------------

                    style:
                        function(feature) {

                            let zoneName =
                                feature.properties
                                    .zone_navn;


                            let zoneColor =
                                "gray";


                            if (
                                zoneName === "Rød"
                            ) {

                                zoneColor =
                                    "#d98b8b";

                            }

                            else if (
                                zoneName === "Grøn"
                            ) {

                                zoneColor =
                                    "#9fbe9f";

                            }

                            else if (
                                zoneName === "Blå"
                            ) {

                                zoneColor =
                                    "#8faec4";

                            }

                            else if (
                                zoneName === "Gul"
                            ) {

                                zoneColor =
                                    "#d8c98a";

                            }


                            return {

                                color: "black",

                                weight: 1,

                                fillColor:
                                zoneColor,

                                fillOpacity: 0.4

                            };

                        },


                    // --------------------------
                    // KLIK PÅ ZONE
                    // --------------------------

                    onEachFeature:
                        function(
                            feature,
                            layer
                        ) {


                            layer.bindPopup(

                                "<b>Zone:</b> " +

                                feature.properties
                                    .zone_navn +

                                "<br><b>Pris:</b> " +

                                feature.properties
                                    .ptakst_dag +

                                " kr./time"

                            );


                            layer.on(
                                "click",
                                function() {


                                    console.log(
                                        "DU HAR KLIKKET PÅ ZONEN"
                                    );


                                    console.log(
                                        feature.properties
                                    );


                                    const zoneName =
                                        feature.properties
                                            .zone_navn;


                                    const price =
                                        feature.properties
                                            .ptakst_dag;


                                    const description =
                                        feature.properties
                                            .beskrivelse;


                                    const center =
                                        layer
                                            .getBounds()
                                            .getCenter();


                                    const lat =
                                        center.lat;


                                    const lon =
                                        center.lng;


                                    console.log(
                                        "Valgt zone:",
                                        zoneName
                                    );


                                    console.log(
                                        "Zone centrum:",
                                        lat,
                                        lon
                                    );


                                    // --------------------------
                                    // ZONE INFORMATION
                                    // --------------------------

                                    document
                                        .getElementById(
                                            "zone-info"
                                        )
                                        .innerHTML = `

                                            <h2>
                                                ${zoneName} zone
                                            </h2>

                                            <p>
                                                ${description}
                                            </p>

                                            <p>
                                                ${price}
                                                kr./time
                                            </p>

                                        `;


                                    // --------------------------
                                    // VIS PARKERINGSAREALER
                                    // --------------------------

                                    showParkingAreas(
                                        zoneName
                                    );

                                }

                            );

                        }

                }

            ).addTo(map);

            if (map.getZoom() >= 18) {
                showParkingAreas("");
            }

        })


        .catch(error => {

            console.error(
                "Kunne ikke hente parkeringszoner:",
                error
            );

        });

</script>

</body>
</html>
