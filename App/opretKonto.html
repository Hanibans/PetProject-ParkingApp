<!DOCTYPE html>
<html lang="da">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Opret bruger</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="colors.css">

</head>
<body>

<div class="login-page">

    <div class="logo">
        <img src="../img/S&N-logo.png" alt="Logo">
    </div>


    <div class="login-box">

        <button type="button" id="back-button" class="back-button">
            <span class="arrow"></span>
        </button>

        <h1>Opret konto</h1>

        <p class="subtitle">
            Indtast venligst dine oplysninger for at tilmelde dig
        </p>

        <form action="map.html">


            <div class="input-group">
                <label for="email">E-mail adresse:</label>
                <input
                        type="email"
                        id="email"
                        placeholder="eksempel@gmail.com"
                >
            </div>


            <div class="telefon-nummer">
                <label for="telefon">Telefonnummer:</label>
                <select name="telefon" >
                    <option value="dk">+45</option>
                </select>
                <input
                        type="tel"
                        id="telefon"
                        placeholder="Indtast dit telefonnummer"
                        maxlength="8"
                        inputmode="numeric"
                >
            </div>

            <div class="input-group">
                <div class="password-label">
                    <label for="password">Adgangskode:</label>
                </div>
                <input type="password" id="password" placeholder="••••••">
            </div>

            <button type="submit" id="submit-button">Opret konto</button>

        </form>

    </div>
</div>


<script>

    const form = document.querySelector("form");
    const backButton = document.getElementById("back-button");
    const submitButton = document.getElementById("submit-button");

    backButton.addEventListener("click", function () {
        window.location.href = "login.html";
    });

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const phone = document.getElementById("telefon").value;
        const password = document.getElementById("password").value;

        if (!email.includes("@")) {
            alert("Indtast en gyldig email.");
            return;
        }
        if (password.length < 6) {
            alert("Adgangskoden skal være mindst 6 tegn.");
            return;
        }

        if (phone.length !== 8) {
            alert("Telefonnummer skal indeholde 8-cifre!");
            return;
        }

        // validering ift. eksisterende brugere
        const users = JSON.parse(localStorage.getItem("users")) || [];

        const emailExists = users.some(function (u) {
            return u.email.toLowerCase() === email.toLowerCase();
        });

        if (emailExists) {
            alert("Der findes allerede en konto med denne email.");
            window.location.href= "login.html";
            return;
        }

        const phoneExists = users.some(function (u) {
            return u.phone === phone;
        });

        if (phoneExists) {
            alert("Der findes allerede en konto med dette telefonnummer.");
            window.location.href= "login.html";
            return;
        }

        // js objekt til at gemme vores user
        const user = {
            email: email,
            phone: phone,
            password: password
        };

        // Tilføj den nye bruger til listen og gem den igen
        users.push(user);
        localStorage.setItem("users", JSON.stringify(users));
        console.log(user.email);
        console.log(user);
        console.log(users);

        submitButton.innerHTML = "Konto oprettet!";

        setTimeout(function () {
            window.location.href = "map.html";
        }, 800);

    });

</script>

</body>
</html>
