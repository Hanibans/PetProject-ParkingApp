<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Opret bruger</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="login-page">
    <!-- Logo -->
    <div class="logo">
        <img src="../img/S&N-logo.png" alt="Logo">
    </div>

    <!-- create account box -->
    <div class="login-box">

        <a href="login.html" class="back-button">
            <span class="arrow"></span>
        </a>

        <h1>Opret konto</h1>

        <p class="subtitle">
            Indtast venligst dine oplysninger for at tilmelde dig
        </p>

        <form action="menu.html">

            <!-- Email -->
            <div class="input-group">
                <label for="email">E-mail adresse:</label>
                <input
                        type="email"
                        id="email"
                        placeholder="eksempel@gmail.com"
                >
            </div>

            <!-- number -->
            <div class="telefon-nummer">
                <label for="telefon">Telefonnummer:</label>
                <select name="telefon" >
                    <option value="dk">+45</option>
                </select>
                <input
                        type="tel"
                        id="telefon"
                        placeholder="Indtast dit telefonnummer"
                        maxlength="8"
                        inputmode="numeric"
                >
            </div>

            <div class="input-group">
                <div class="password-label">
                    <label for="password">Adgangskode:</label>
                </div>
                <input type="password" id="password" placeholder="••••••">
            </div>

            <!-- opret button -->
            <button type="submit">Opret konto</button>

        </form>

    </div>
</div>


<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const phone = document.getElementById("telefon").value;
        const password = document.getElementById("password").value;

        if (!email.includes("@")) {
            alert("Indtast en gyldig email.");
            return;
        }
        if (password.length < 6) {
            alert("Adgangskoden skal være mindst 6 tegn.");
            return;
        }
        if (phone === "") {
            alert("Indtast dit telefonnummer.");
            return;
        }
        if (!phone.includes()) {
            alert("Indtast dit telefonnummer.");
            return;
        }

        window.location.href = "map.html";
    });
</script>

</body>
</html>
