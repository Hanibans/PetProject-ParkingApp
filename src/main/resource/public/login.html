<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="colors.css">
</head>

<body>

<div class="login-page">

    <div class="logo">
        <img src="/img/S&N-logo.png" alt="Logo">
    </div>

    <div class="login-box">

        <h1>Log ind på kontoen</h1>

        <p class="subtitle">
            Log venligst ind på din parkeringskonto
        </p>

        <form action="/login" method="post">

            <div class="input-group">
                <label for="email">E-mail adresse:</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="eksempel@gmail.com"
                        required
                >
            </div>

            <div class="password-label">
                <label for="password">Adgangskode:</label>
                <a href="#">Glemt adgangskode?</a>
            </div>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••"
                    required
            >

            <div class="remember">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Husk adgangskode</label>
            </div>

            <button type="submit">Log ind</button>

        </form>

        <div class="create-account">
            <span>Har du ikke en konto?</span>
            <a href="/createuser">Opret konto</a>
        </div>

    </div>
</div>

</body>
</html>
