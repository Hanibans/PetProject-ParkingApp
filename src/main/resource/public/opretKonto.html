<!DOCTYPE html>
<html lang="da">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Opret bruger</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="colors.css">
</head>
<body>

<div class="login-page">

    <div class="logo">
        <img src="../img/S&N-logo.png" alt="Logo">
    </div>

    <div class="login-box">


        <a href="/login" class="back-button" class="back-button">
            <span class="arrow"></span>
        </a>

        <h1>Opret konto</h1>

        <p class="subtitle">
            Indtast venligst dine oplysninger for at tilmelde dig
        </p>

        <form action="/opretkonto" method="post">

            <div class="input-group">
                <label for="email">E-mail adresse:</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="eksempel@gmail.com"
                        required
                >
            </div>

            <div class="telefon-nummer">
                <label for="telefon">Telefonnummer:</label>
                <select name="landekode">
                    <option value="dk">+45</option>
                </select>
                <input
                        type="tel"
                        id="telefon"
                        name="phonenumber"
                        placeholder="Indtast dit telefonnummer"
                        maxlength="8"
                        inputmode="numeric"
                        required
                >
            </div>

            <div class="input-group">
                <div class="password-label">
                    <label for="password">Adgangskode:</label>
                </div>
                <input type="password" id="password" name="password" placeholder="••••••" required>
            </div>

            <button type="submit" id="submit-button">Opret konto</button>

        </form>

    </div>
</div>


</body>
</html>
