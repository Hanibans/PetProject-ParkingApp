<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Min parkeringshistorik</title>

    <link rel="stylesheet" href="/parkinghistory.css">
    <link rel="stylesheet" href="/colors.css">
</head>


<body>

<div class="account-page">

    <!-- Toppen -->
    <div class="account-header history-header">

        <a href="/menu" class="back-button">←</a>

        <h1>Min parkeringshistorik</h1>

    </div>

    <!-- Parkeringshistorik -->
    <div class="account-content">

        <h2>Dine tidligere parkeringer</h2>

        <!-- Hvis der ikke er nogen parkeringer -->
        <div th:if="${#lists.isEmpty(history)}"
             class="history-empty">

            <p>Du har ingen afsluttede parkeringer endnu.</p>

        </div>

        <!-- Liste over parkeringer -->
        <div th:each="parking : ${history}"
             class="history-card">

            <div class="history-card-header">

                <h3 th:text="${parking.licensePlate}">
                    CD67890
                </h3>

                <span class="history-zone"
                      th:classappend="${parking.zoneName != null
                        ? ' zone-' + #strings.toLowerCase(parking.zoneName)
                        : ''}"
                      th:text="${parking.zoneName}">
                    Blå
                </span>

            </div>

            <div class="history-field">
                <label>Sted</label>
                <span th:text="${parking.address != null
                    ? parking.address : 'Ukendt adresse'}">
                    Adresse
                </span>
            </div>

            <div class="history-field">
                <label>Parkeringsordning</label>
                <span th:text="${parking.parkingSpotType}">
                    regular
                </span>
            </div>

            <div class="history-field">
                <label>Starttidspunkt</label>
                <span th:text="${parking.startTime}">
                    Starttidspunkt
                </span>
            </div>

            <div class="history-field">
                <label>Sluttidspunkt</label>
                <span th:text="${parking.endTime}">
                    Sluttidspunkt
                </span>
            </div>


            <div class="history-total">
                <span>Samlet pris</span>
                <strong th:text="${parking.totalCost != null
                    ? parking.totalCost + ' kr.'
                    : 'Mangler betaling'}">
                    Samlet pris
                </strong>
            </div>

            <div class="history-payment">

                <div class="history-payment-status">
                    <span class="history-payment-label">Betalingsstatus</span>

                    <span class="history-payment-badge"
                          th:classappend="${parking.paymentStatus == 'Betalt'
                  ? ' status-paid'
                  : ' status-pending'}"
                          th:text="${parking.paymentStatus == 'Betalt'
                  ? 'Betalt'
                  : 'Afventer betaling'}">
            Afventer betaling
        </span>
                </div>

                <div th:if="${parking.paymentStatus == 'Afventer'}"
                     class="history-payment-action"
                     th:attr="data-parking-id=${parking.parkingId}">

                    <button type="button"
                            class="history-pay-button"
                            onclick="showPaymentOptions(this)">
                        Betal nu
                    </button>

                    <form action="/payments/pay"
                          method="post"
                          class="history-pay-form"
                          hidden>

                        <input type="hidden"
                               name="parkingId"
                               th:value="${parking.parkingId}">

                        <label th:for="${'paymentMethod-' + parking.parkingId}">
                            Vælg betalingskort
                        </label>

                        <select name="paymentMethodId"
                                th:id="${'paymentMethod-' + parking.parkingId}"
                                th:if="${!#lists.isEmpty(paymentMethods)}"
                                required>

                            <option value="" disabled selected>Vælg et kort</option>

                            <option th:each="method : ${paymentMethods}"
                                    th:value="${method.paymentMethodId}"
                                    th:text="${method.cardBrand + ' •••• ' + method.cardLastFour}">
                                Visa •••• 1234
                            </option>
                        </select>

                        <button type="submit"
                                class="history-pay-button"
                                th:if="${!#lists.isEmpty(paymentMethods)}">
                            Bekræft betaling
                        </button>

                        <p class="history-payment-message"
                           role="alert"
                           hidden></p>

                        <div th:if="${#lists.isEmpty(paymentMethods)}"
                             class="history-no-cards">

                            <p>Du har ikke tilføjet et betalingskort endnu.</p>
                            <a href="/payments">Tilføj et betalingskort</a>
                        </div>
                    </form>
                </div>

            </div>

        </div>

    </div>

</div>

<script>
    function showPaymentOptions(button) {
        const container = button.closest(".history-payment-action");
        const form = container.querySelector(".history-pay-form");

        form.hidden = !form.hidden;
        button.textContent = form.hidden
            ? "Betal nu"
            : "Skjul betalingsmuligheder";
    }

    document.querySelectorAll(".history-pay-form").forEach(function (form) {
        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = form.querySelector(".history-payment-message");
            const submitButton = form.querySelector('button[type="submit"]');

            message.hidden = true;
            submitButton.disabled = true;

            try {
                const formData = new URLSearchParams(new FormData(form));

                const response = await fetch("/payments/pay", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Betalingen kunne ikke gennemføres.");
                }

                window.location.href = "/payment-success";

            } catch (error) {
                message.textContent = "Fejl: " + error.message;
                message.hidden = false;
                submitButton.disabled = false;
            }
        });
    });
</script>

</body>

</html>
