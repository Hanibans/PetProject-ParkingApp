<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-page">

    <!-- Logo -->
    <div class="logo">
        <img src="../img/S&N-logo.png" alt="Logo">
    </div>

    <!-- Login box -->
    <div class="login-box">

        <h1>Log ind på kontoen</h1>

        <p class="subtitle">
            Log venligst ind på din parkeringskonto
        </p>

        <form action="map.html">

            <!-- Email -->
            <div class="input-group">
                <label for="email">E-mail adresse:</label>
                <input
                        type="email"
                        id="email"
                        placeholder="eksempel@gmail.com"
                >
            </div>

            <!-- Password -->
            <div class="password-label">
                <label for="password">Adgangskode:</label>
                <a href="#">Glemt adgangskode?</a>
            </div>

            <input
                    type="password"
                    id="password"
                    placeholder="••••••"
            >

            <!-- Remember me -->
            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Husk adgangskode</label>
            </div>

            <!-- Login button -->
            <button type="submit">Log ind</button>

        </form>

        <!-- Create account -->
        <div class="create-account">
            <span>Har du ikke en konto?</span>
            <a href="opretKonto.html">Opret konto</a>
        </div>

    </div>
</div>

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function (e) {
      //e.preventDefault(); // stop the page from reloading

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email === "" || password === "") {
            alert("Udfyld venligst både email og adgangskode.");
            return;
        }

        // "Husk adgangskode" checkbox
        const remember = document.getElementById("remember").checked;
        if (remember) {
            localStorage.setItem("savedEmail", email);
        }

        // pretend login succeeded, go to menu
        window.location.href = "map.html";
    });

    // auto-fill email if it was saved earlier
    window.addEventListener("DOMContentLoaded", function () {
        const saved = localStorage.getItem("savedEmail");
        if (saved) {
            document.getElementById("email").value = saved;
        }
    });

</script>

</body>
</html>
