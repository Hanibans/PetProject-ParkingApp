<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mine køretøjer</title>

    <link rel="stylesheet" href="/vehicle.css">
    <link rel="stylesheet" href="/colors.css">
</head>
<body>

<div class="vehicles-page">

    <!-- Top -->
    <div class="vehicles-header">

        <a href="/menu" class="back-button">←</a>

        <h1>Mine køretøjer</h1>

    </div>


    <div class="vehicles-content">

        <h2>Dine køretøjer</h2>


        <!-- Hvis brugeren ikke har nogen biler -->
        <div th:if="${#lists.isEmpty(cars)}" class="no-cars">
            <p>Du har ikke tilføjet noget køretøj endnu.</p>
        </div>


        <!-- Viser brugerens biler -->
        <div th:each="car : ${cars}" class="vehicle-card">

            <div class="vehicle-info">
                <img src="/img/car-icon.png" alt="Bil">

                <span th:text="${car.licensePlate}"></span>

                <span class="car-type" th:text="${car.type}"></span>
            </div>

            <!-- Slet bil -->
            <form action="/vehicles/remove" method="post">

                <input
                        type="hidden"
                        name="licensePlate"
                        th:value="${car.licensePlate}">

                <button type="submit" class="delete-button">
                    Slet
                </button>

            </form>

        </div>


        <!-- Tilføj køretøj -->
        <div class="add-vehicle">

            <h2>Tilføj køretøj</h2>

            <form action="/vehicles/add" method="post">

                <label for="licensePlate">
                    Nummerplade
                </label>

                <input
                        type="text"
                        id="licensePlate"
                        name="licensePlate"
                        placeholder="F.eks. AB12345"
                        required>

                <label for="carType">
                    Biltype
                </label>

                <select
                        id="carType"
                        name="carType"
                        required>

                    <option value="">
                        Vælg biltype
                    </option>

                    <option value="Almindelig">
                        Almindelig bil
                    </option>

                    <option value="Elbil">
                        Elbil
                    </option>

                    <option value="Handicap">
                        Handicapbil
                    </option>

                    <option value="Delebil">
                        Delebil
                    </option>

                </select>

                <button type="submit" class="add-button">
                    Tilføj køretøj
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
